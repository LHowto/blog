    <meta charset="UTF-8">

    <title>我们的恋爱回忆</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #ffeef8 100%);
            min-height: 100vh;
            padding: 40px 20px;
            color: #333;
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeIn 1.5s ease;
        }
        
        .header h1 {
            font-size: 3rem;
            color: #ff6b9d;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }
        
        .header p {
            font-size: 1.2rem;
            color: #666;
            max-width: 800px;
            margin: 0 auto;
            line-height: 1.6;
        }
        
        .photo-wall {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            grid-gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .photo-frame {
            position: relative;
            height: 280px;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            background: #fff;
            transform-style: preserve-3d;
            perspective: 1000px;
        }
        
        .photo-frame:hover {
            transform: translateY(-10px) scale(1.03);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
        }
        
        .photo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }
        
        .photo-frame:hover .photo {
            transform: scale(1.1);
        }
        
        .photo-info {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.8), transparent);
            color: white;
            padding: 20px;
            transform: translateY(100%);
            transition: transform 0.3s ease;
            backdrop-filter: blur(5px);
        }
        
        .photo-frame:hover .photo-info {
            transform: translateY(0);
        }
        
        .photo-date {
            font-size: 0.9rem;
            margin-bottom: 5px;
            color: #ffb6d5;
        }
        
        .photo-desc {
            font-size: 1rem;
            line-height: 1.4;
        }
        
        .special {
            grid-column: span 2;
            height: 350px;
        }
        
        .special .photo-info {
            padding: 30px;
        }
        
        .heart-container {
            position: relative;
            width: 100%;
            height: 100%;
        }
        
        .heart-photo {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            clip-path: url(#heart-path);
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .photo-frame {
            animation: fadeIn 0.8s ease forwards;
            opacity: 0;
        }
        
        .footer {
            text-align: center;
            margin-top: 60px;
            padding: 20px;
            font-size: 1.1rem;
            color: #ff6b9d;
            animation: fadeIn 2s ease;
        }
        
        @media (max-width: 768px) {
            .photo-wall {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            }
            
            .special {
                grid-column: span 1;
                height: 280px;
            }
            
            .header h1 {
                font-size: 2.2rem;
            }
        }
        
        .hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }
        
        .heart {
            position: absolute;
            opacity: 0.3;
            animation: float 6s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
        }
    </style>
</head>

        // 动态生成照片墙
        function renderPhotoWall() {
            const photoWall = document.getElementById('photoWall');
            
            // 更新标题和页脚
            document.querySelector('.header h1').textContent = photosData.title;
            document.querySelector('.header p').textContent = photosData.subtitle;
            document.querySelector('.footer p').textContent = photosData.footer;
            
            // 清空现有内容
            photoWall.innerHTML = '';
            
            // 为每张照片创建HTML
            photosData.photos.forEach((photo, index) => {
                const photoFrame = document.createElement('div');
                photoFrame.className = `photo-frame ${photo.special ? 'special' : ''}`;
                photoFrame.style.animationDelay = `${0.2 + index * 0.2}s`;
                
                if (photo.heartShape) {
                    photoFrame.innerHTML = `
                        <div class="heart-container">
                            <img src="${photo.src}" alt="${photo.alt}" class="photo heart-photo">
                            <div class="photo-info">
                                <div class="photo-date">${photo.date}</div>
                                <div class="photo-desc">${photo.desc}</div>
                            </div>
                        </div>
                    `;
                } else {
                    photoFrame.innerHTML = `
                        <img src="${photo.src}" alt="${photo.alt}" class="photo">
                        <div class="photo-info">
                            <div class="photo-date">${photo.date}</div>
                            <div class="photo-desc">${photo.desc}</div>
                        </div>
                    `;
                }
                
                photoWall.appendChild(photoFrame);
            });
        }
        
        // 创建漂浮的心形背景
        function createHearts() {
            const heartsContainer = document.getElementById('hearts');
            const colors = ['#ff6b9d', '#ffb6d5', '#ffd1e6', '#ff9ec6'];
            
            for (let i = 0; i < 15; i++) {
                const heart = document.createElement('div');
                heart.classList.add('heart');
                heart.innerHTML = '❤';
                
                // 随机属性
                const size = Math.random() * 30 + 10;
                const posX = Math.random() * 100;
                const posY = Math.random() * 100;
                const delay = Math.random() * 5;
                const duration = Math.random() * 3 + 3;
                const color = colors[Math.floor(Math.random() * colors.length)];
                
                heart.style.left = `${posX}%`;
                heart.style.top = `${posY}%`;
                heart.style.fontSize = `${size}px`;
                heart.style.color = color;
                heart.style.animationDelay = `${delay}s`;
                heart.style.animationDuration = `${duration}s`;
                
                heartsContainer.appendChild(heart);
            }
        }
        
        // 页面加载后执行
        window.addEventListener('load', () => {
            createHearts();
            renderPhotoWall();
        });
    </script>
